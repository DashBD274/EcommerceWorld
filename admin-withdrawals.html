<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Withdrawals - UMALL247 Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: #f1f5f9; min-height: 100vh; }
        
        .admin-header {
            background: #1e293b; padding: 14px 20px;
            display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 100;
        }
        
        .back-btn { color: #f59e0b; font-size: 18px; text-decoration: none; }
        .admin-header h1 { font-size: 17px; font-weight: 800; }
        
        .admin-content { max-width: 900px; margin: 0 auto; padding: 20px; }
        
        .filter-tabs {
            display: flex; gap: 8px; margin-bottom: 20px;
            background: #1e293b; border: 1px solid #334155;
            border-radius: 12px; padding: 5px;
        }
        
        .filter-tab {
            flex: 1; padding: 10px; border-radius: 8px;
            background: transparent; border: none;
            color: #94a3b8; cursor: pointer;
            font-weight: 600; font-size: 13px;
            font-family: inherit;
        }
        
        .filter-tab.active { background: #f59e0b; color: #fff; }
        
        .withdrawals-list { display: flex; flex-direction: column; gap: 12px; }
        
        .wd-card {
            background: #1e293b; border: 1px solid #334155;
            border-radius: 14px; padding: 16px;
        }
        
        .wd-card.pending { border-left: 4px solid #f59e0b; }
        .wd-card.approved { border-left: 4px solid #10b981; }
        .wd-card.rejected { border-left: 4px solid #ef4444; }
        
        .wd-header {
            display: flex; justify-content: space-between;
            align-items: flex-start; margin-bottom: 12px;
        }
        
        .wd-user { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
        .wd-email { font-size: 11.5px; color: #94a3b8; }
        
        .wd-status {
            padding: 4px 10px; border-radius: 8px;
            font-size: 10.5px; font-weight: 700;
            text-transform: uppercase;
        }
        
        .wd-status.pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .wd-status.approved { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
        .wd-status.rejected { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
        
        .wd-details {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 10px; margin-bottom: 14px;
            background: #0f172a; padding: 14px; border-radius: 10px;
        }
        
        .wd-detail-row { font-size: 12px; }
        .wd-detail-label { color: #64748b; margin-bottom: 3px; }
        .wd-detail-value { font-weight: 700; }
        .wd-detail-value.amount { color: #f59e0b; font-size: 15px; }
        .wd-detail-value.wallet { font-size: 10px; word-break: break-all; font-family: monospace; color: #cbd5e1; }
        
        .wd-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .wd-btn {
            padding: 12px; border-radius: 10px; border: none;
            font-size: 13px; font-weight: 700;
            cursor: pointer; font-family: inherit;
        }
        
        .wd-btn.approve { background: linear-gradient(90deg, #10b981, #059669); color: #fff; }
        .wd-btn.reject { background: linear-gradient(90deg, #ef4444, #dc2626); color: #fff; }
        .wd-btn:disabled { opacity: 0.5; }
        .wd-btn:active { transform: scale(0.97); }
        
        .loading-state { text-align: center; padding: 40px; color: #94a3b8; }
        .loading-state i { font-size: 32px; color: #f59e0b; display: block; margin-bottom: 12px; }
        
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: #f1f5f9; padding: 14px 22px;
            border-radius: 12px; font-size: 14px; font-weight: 600;
            z-index: 99999; display: none; border: 1px solid #334155;
        }
        .toast.success { border-color: #10b981; color: #6ee7b7; }
        .toast.error { border-color: #ef4444; color: #fca5a5; }
        .toast.show { display: block; }
        
        @media (max-width: 480px) {
            .wd-details { grid-template-columns: 1fr; }
            .admin-header h1 { font-size: 15px; }
        }
    </style>
</head>
<body>

    <header class="admin-header">
        <a href="admin.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <h1>Withdrawal Requests</h1>
    </header>
    
    <div class="admin-content">
        
        <div class="filter-tabs">
            <button class="filter-tab active" data-status="pending">Pending</button>
            <button class="filter-tab" data-status="approved">Approved</button>
            <button class="filter-tab" data-status="rejected">Rejected</button>
            <button class="filter-tab" data-status="all">All</button>
        </div>
        
        <div class="withdrawals-list" id="wdList">
            <div class="loading-state">
                <i class="fa-solid fa-spinner fa-spin"></i>
                Loading withdrawals...
            </div>
        </div>
        
    </div>
    
    <div class="toast" id="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-auth.js"></script>

    <script>
        let currentFilter = 'pending';
        let allWithdrawals = [];
        
        auth.onAuthStateChanged(async function(user) {
            if (!user) { window.location.replace('admin-login.html'); return; }
            const adminDoc = await db.collection('admins').doc(user.uid).get();
            if (!adminDoc.exists) { await auth.signOut(); window.location.replace('admin-login.html'); return; }
            loadWithdrawals();
        });
        
        async function loadWithdrawals() {
            const listEl = document.getElementById('wdList');
            try {
                const snap = await db.collection('withdrawals').orderBy('createdAt', 'desc').limit(100).get();
                allWithdrawals = [];
                snap.forEach(doc => allWithdrawals.push({ id: doc.id, ...doc.data() }));
                renderWithdrawals();
            } catch (err) {
                console.error('Load error:', err);
                listEl.innerHTML = '<div class="loading-state"><i class="fa-solid fa-circle-exclamation"></i>Failed to load</div>';
            }
        }
        
        function renderWithdrawals() {
            const listEl = document.getElementById('wdList');
            let filtered = allWithdrawals;
            if (currentFilter !== 'all') {
                filtered = allWithdrawals.filter(w => w.status === currentFilter);
            }
            
            if (filtered.length === 0) {
                listEl.innerHTML = '<div class="loading-state"><i class="fa-solid fa-inbox"></i>No ' + currentFilter + ' withdrawals</div>';
                return;
            }
            
            let html = '';
            filtered.forEach(w => {
                const date = w.createdAt && w.createdAt.toDate 
                    ? w.createdAt.toDate().toLocaleString() 
                    : 'N/A';
                
                const actionsHtml = w.status === 'pending' ? `
                    <div class="wd-actions">
                        <button class="wd-btn approve" onclick="processWithdrawal('${w.id}', 'approved')">
                            <i class="fa-solid fa-check"></i> Approve
                        </button>
                        <button class="wd-btn reject" onclick="processWithdrawal('${w.id}', 'rejected')">
                            <i class="fa-solid fa-xmark"></i> Reject
                        </button>
                    </div>
                ` : '';
                
                html += `
                    <div class="wd-card ${w.status}">
                        <div class="wd-header">
                            <div>
                                <div class="wd-user">${w.userName || 'Unknown'}</div>
                                <div class="wd-email">${w.userEmail || '-'}</div>
                            </div>
                            <span class="wd-status ${w.status}">${w.status}</span>
                        </div>
                        
                        <div class="wd-details">
                            <div class="wd-detail-row">
                                <div class="wd-detail-label">Amount</div>
                                <div class="wd-detail-value amount">$${(w.amount || 0).toFixed(2)}</div>
                            </div>
                            <div class="wd-detail-row">
                                <div class="wd-detail-label">Fee (5%)</div>
                                <div class="wd-detail-value">$${(w.fee || 0).toFixed(2)}</div>
                            </div>
                            <div class="wd-detail-row">
                                <div class="wd-detail-label">Net Amount</div>
                                <div class="wd-detail-value" style="color:#10b981;">$${(w.netAmount || 0).toFixed(2)}</div>
                            </div>
                            <div class="wd-detail-row">
                                <div class="wd-detail-label">Method</div>
                                <div class="wd-detail-value">${w.method || 'USDT TRC20'}</div>
                            </div>
                            <div class="wd-detail-row" style="grid-column: 1 / -1;">
                                <div class="wd-detail-label">Wallet Address</div>
                                <div class="wd-detail-value wallet">${w.walletAddress || '-'}</div>
                            </div>
                            <div class="wd-detail-row" style="grid-column: 1 / -1;">
                                <div class="wd-detail-label">Requested</div>
                                <div class="wd-detail-value" style="font-weight:500;font-size:11px;color:#94a3b8;">${date}</div>
                            </div>
                        </div>
                        
                        ${actionsHtml}
                    </div>
                `;
            });
            
            listEl.innerHTML = html;
        }
        
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.getAttribute('data-status');
                renderWithdrawals();
            });
        });
        
        async function processWithdrawal(wid, status) {
            if (!confirm(`Are you sure you want to ${status} this withdrawal?`)) return;
            
            try {
                const wdDoc = await db.collection('withdrawals').doc(wid).get();
                if (!wdDoc.exists) { showToast('❌ Not found', 'error'); return; }
                const wd = wdDoc.data();
                
                if (wd.status !== 'pending') { showToast('❌ Already processed', 'error'); return; }
                
                await db.collection('withdrawals').doc(wid).update({
                    status: status,
                    processedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                if (status === 'approved') {
                    await db.collection('users').doc(wd.uid).update({
                        balance: firebase.firestore.FieldValue.increment(-(wd.amount || 0))
                    });
                }
                
                await db.collection('transactions').add({
                    uid: wd.uid,
                    type: status === 'approved' ? 'withdrawal_approved' : 'withdrawal_rejected',
                    amount: wd.amount || 0,
                    status: status,
                    note: `Withdrawal ${status} by admin`,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                showToast(`✅ Withdrawal ${status}!`, 'success');
                loadWithdrawals();
            } catch (err) {
                console.error('Process error:', err);
                showToast('❌ Failed. Try again.', 'error');
            }
        }
        
        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type + ' show';
            setTimeout(() => t.className = 'toast ' + type, 3000);
        }
    </script>
</body>
</html>

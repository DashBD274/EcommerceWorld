<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5f5f5">
    <title>Record - UMALL247</title>
    <link rel="stylesheet" href="detail.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ================= Record পেজ ================= */
        .record-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 16px 30px 16px;
        }

        .record-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 16px;
            letter-spacing: 0.3px;
        }

        /* সার্চ বার */
        .search-bar {
            background: var(--card);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .search-bar i {
            color: var(--text-light);
            font-size: 15px;
            flex-shrink: 0;
        }

        .search-bar input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-size: 14px;
            color: var(--text);
            font-family: inherit;
            -webkit-appearance: none;
            appearance: none;
        }

        .search-bar input::placeholder {
            color: var(--text-light);
            opacity: 0.8;
        }

        /* ফিল্টার */
        .filter-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-select {
            background: var(--card);
            border-radius: 12px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            position: relative;
        }

        .filter-select select {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-size: 13.5px;
            color: var(--text);
            font-family: inherit;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            padding-right: 20px;
            font-weight: 500;
        }

        .filter-select::after {
            content: '\f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 12px;
            pointer-events: none;
        }

        /* No Transactions */
        .empty-state {
            background: var(--card);
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .empty-state p {
            font-size: 15px;
            color: var(--text-light);
            font-weight: 500;
            margin: 0;
        }

        .empty-state.hidden {
            display: none;
        }

        /* RTL */
        body.rtl .filter-select::after {
            right: auto;
            left: 14px;
        }

        body.rtl .search-bar {
            flex-direction: row-reverse;
        }

        /* মোবাইল */
        @media (max-width: 360px) {
            .record-title { font-size: 18px; }
            .search-bar { padding: 10px 14px; }
            .search-bar input { font-size: 13px; }
            .filter-select { padding: 10px 12px; }
            .filter-select select { font-size: 12.5px; }
            .empty-state { padding: 50px 16px; }
            .empty-state p { font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- ================= Record কনটেন্ট ================= -->
    <main class="record-container">

        <h1 class="record-title" data-key="transactionHistory">Transaction History</h1>

        <!-- সার্চ বার -->
        <div class="search-bar">

            <input type="text" id="searchInput" placeholder="Search records..." data-key="searchRecords">
        </div>

        <!-- ফিল্টার -->
        <div class="filter-row">
            <div class="filter-select">
                <select id="typeFilter">
                    <option value="all" data-key="allTypes">All Types</option>
                    <option value="deposit" data-key="typeDeposit">Deposit</option>
                    <option value="withdrawal" data-key="typeWithdrawal">Withdrawal</option>
                    <option value="commission" data-key="typeCommission">Commission</option>
                    <option value="order" data-key="typeOrder">Order</option>
                </select>
            </div>
            <div class="filter-select">
                <select id="statusFilter">
                    <option value="all" data-key="allStatuses">All Statuses</option>
                    <option value="pending" data-key="statusPending">Pending</option>
                    <option value="completed" data-key="statusCompleted">Completed</option>
                    <option value="failed" data-key="statusFailed">Failed</option>
                </select>
            </div>
        </div>

        <!-- No Transactions -->
        <div class="empty-state" id="emptyState">
            <p data-key="noTransactions">No transactions found</p>
        </div>

        <!-- ট্রানজেকশন লিস্ট (ভবিষ্যতে ডেটা আসলে এখানে দেখাবে) -->
        <div id="transactionList"></div>

    </main>

        // অনুবাদ প্রয়োগ
        function applyRecordLanguage(lang) {
            const elements = document.querySelectorAll('[data-key]');
            elements.forEach(el => {
                const key = el.getAttribute('data-key');
                if (recordTranslations[lang] && recordTranslations[lang][key]) {
                    if (el.tagName === 'INPUT') {
                        el.placeholder = recordTranslations[lang][key];
                    } else {
                        el.textContent = recordTranslations[lang][key];
                    }
                } else if (typeof detailTranslations !== 'undefined' && detailTranslations[lang] && detailTranslations[lang][key]) {
                    el.textContent = detailTranslations[lang][key];
                }
            });
            const sel = document.getElementById('dashLanguageSelect');
            if (sel) sel.value = lang;
        }

        // প্রাথমিক লোড
        const recordLang = safeGet('language') || 'en';
        applyRecordLanguage(recordLang);

        // ভাষা পরিবর্তন
        const recordLangSelect = document.getElementById('dashLanguageSelect');
        if (recordLangSelect) {
            recordLangSelect.addEventListener('change', function() {
                const newLang = this.value;
                safeSet('language', newLang);
                applyRecordLanguage(newLang);
                if (typeof applyDetailDirection === 'function') {
                    applyDetailDirection(newLang);
                }
            });
        }

        // ================= সার্চ ও ফিল্টার Functionality =================
        const searchInput = document.getElementById('searchInput');
        const typeFilter = document.getElementById('typeFilter');
        const statusFilter = document.getElementById('statusFilter');

        function filterTransactions() {
            console.log('Filtering:', {
                search: searchInput.value,
                type: typeFilter.value,
                status: statusFilter.value
            });
        }

        if (searchInput) searchInput.addEventListener('input', filterTransactions);
        if (typeFilter) typeFilter.addEventListener('change', filterTransactions);
        if (statusFilter) statusFilter.addEventListener('change', filterTransactions);

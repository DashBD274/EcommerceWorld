<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5f5f5">
    <title>Service - UMALL247</title>
    <link rel="stylesheet" href="detail.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .service-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 16px 30px 16px;
        }

        .support-card {
            background: var(--card);
            border-radius: 16px;
            padding: 24px 20px;
            text-align: center;
            margin-bottom: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .support-title {
            font-size: 22px;
            font-weight: 800;
            color: #e65c00;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .support-subtitle {
            font-size: 13.5px;
            color: var(--text-light);
            line-height: 1.5;
            margin: 0;
        }

        .telegram-card {
            background: var(--card);
            border-radius: 14px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            border-left: 4px solid #229ED9;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .telegram-card:active {
            transform: scale(0.98);
            box-shadow: 0 6px 16px rgba(34, 158, 217, 0.15);
        }

        .telegram-icon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #e6f4fb;
            color: #229ED9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        body.dark-mode .telegram-icon {
            background: rgba(34, 158, 217, 0.15);
            color: #4bb3e0;
        }

        .telegram-content { flex: 1; min-width: 0; }

        .telegram-content h4 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .telegram-content p {
            font-size: 12.5px;
            color: var(--text-light);
            margin: 0;
            line-height: 1.4;
        }

        body.rtl .telegram-card {
            border-left: 1px solid var(--border);
            border-right: 4px solid #229ED9;
            flex-direction: row-reverse;
        }

        @media (max-width: 360px) {
            .support-title { font-size: 19px; }
            .support-subtitle { font-size: 12px; }
            .telegram-icon { width: 40px; height: 40px; font-size: 19px; }
            .telegram-content h4 { font-size: 14px; }
            .telegram-content p { font-size: 11.5px; }
        }
    </style>
</head>
<body>

    <header class="dash-header">
        <div class="brand-logo">
            <span class="logo-icon">U<span class="fire-flame"></span></span>
            <span class="logo-text">UMALL<span class="logo-24">247</span></span>
        </div>
        <div class="header-controls">
            <div class="lang-selector-sm">
                <select id="dashLanguageSelect">
                    <option value="en">US English</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="it">Italiano</option>
                    <option value="pt">Português</option>
                    <option value="nl">Nederlands</option>
                    <option value="ru">Русский</option>
                    <option value="tr">Türkçe</option>
                    <option value="ar">العربية</option>
                    <option value="fa">فارسی</option>
                </select>
            </div>
            <button id="dashThemeToggle" class="theme-toggle-sm" type="button">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <main class="service-container">

        <div class="support-card">
            <h2 class="support-title" data-key="customerSupport">Customer Support</h2>
            <p class="support-subtitle" data-key="customerSupportDesc">Need help? Contact our 24/7 online customer service agents</p>
        </div>

        <a href="https://t.me/" target="_blank" rel="noopener" class="telegram-card">
            <div class="telegram-icon">
                <i class="fa-brands fa-telegram"></i>
            </div>
            <div class="telegram-content">
                <h4 data-key="telegramTitle">Official Telegram Channel</h4>
                <p data-key="telegramDesc">Join community updates and announcements</p>
            </div>
        </a>

    </main>

    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span data-key="navHome">Home</span>
        </a>
        <a href="service.html" class="nav-item active">
            <i class="fa-solid fa-headset"></i>
            <span data-key="navService">Service</span>
        </a>
        <a href="menu.html" class="nav-item">
            <i class="fa-solid fa-grip"></i>
            <span data-key="navMenu">Menu</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-clipboard"></i>
            <span data-key="navRecord">Record</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span data-key="navMine">Mine</span>
        </a>
    </nav>

    <script src="detail.js"></script>
    <script>
        const serviceTranslations = {
            en: {
                customerSupport: "Customer Support",
                customerSupportDesc: "Need help? Contact our 24/7 online customer service agents",
                telegramTitle: "Official Telegram Channel",
                telegramDesc: "Join community updates and announcements"
            },
            es: {
                customerSupport: "Atención al Cliente",
                customerSupportDesc: "¿Necesita ayuda? Contacte a nuestros agentes de servicio al cliente en línea 24/7",
                telegramTitle: "Canal Oficial de Telegram",
                telegramDesc: "Únase a las actualizaciones y anuncios de la comunidad"
            },
            fr: {
                customerSupport: "Support Client",
                customerSupportDesc: "Besoin d'aide ? Contactez nos agents de service client en ligne 24h/24 et 7j/7",
                telegramTitle: "Canal Telegram Officiel",
                telegramDesc: "Rejoignez les mises à jour et annonces de la communauté"
            },
            de: {
                customerSupport: "Kundensupport",
                customerSupportDesc: "Brauchen Sie Hilfe? Kontaktieren Sie unsere 24/7 Online-Kundendienstmitarbeiter",
                telegramTitle: "Offizieller Telegram-Kanal",
                telegramDesc: "Treten Sie Community-Updates und Ankündigungen bei"
            },
            it: {
                customerSupport: "Supporto Clienti",
                customerSupportDesc: "Hai bisogno di aiuto? Contatta i nostri agenti di assistenza clienti online 24/7",
                telegramTitle: "Canale Telegram Ufficiale",
                telegramDesc: "Unisciti agli aggiornamenti e agli annunci della community"
            },
            pt: {
                customerSupport: "Suporte ao Cliente",
                customerSupportDesc: "Precisa de ajuda? Contate nossos agentes de atendimento ao cliente online 24/7",
                telegramTitle: "Canal Oficial do Telegram",
                telegramDesc: "Junte-se às atualizações e anúncios da comunidade"
            },
            nl: {
                customerSupport: "Klantenondersteuning",
                customerSupportDesc: "Hulp nodig? Neem contact op met onze 24/7 online klantenservice",
                telegramTitle: "Officieel Telegram-kanaal",
                telegramDesc: "Sluit je aan bij community-updates en aankondigingen"
            },
            ru: {
                customerSupport: "Поддержка Клиентов",
                customerSupportDesc: "Нужна помощь? Свяжитесь с нашими онлайн-агентами поддержки клиентов 24/7",
                telegramTitle: "Официальный Telegram-канал",
                telegramDesc: "Присоединяйтесь к обновлениям и объявлениям сообщества"
            },
            tr: {
                customerSupport: "Müşteri Desteği",
                customerSupportDesc: "Yardıma mı ihtiyacınız var? 7/24 çevrimiçi müşteri hizmetleri temsilcilerimizle iletişime geçin",
                telegramTitle: "Resmi Telegram Kanalı",
                telegramDesc: "Topluluk güncellemelerine ve duyurularına katılın"
            },
            ar: {
                customerSupport: "دعم العملاء",
                customerSupportDesc: "هل تحتاج مساعدة؟ اتصل بموظفي خدمة العملاء عبر الإنترنت على مدار الساعة",
                telegramTitle: "قناة تيليجرام الرسمية",
                telegramDesc: "انضم إلى تحديثات المجتمع والإعلانات"
            },
            fa: {
                customerSupport: "پشتیبانی مشتری",
                customerSupportDesc: "به کمک نیاز دارید؟ با نمایندگان خدمات مشتری آنلاین 24/7 ما تماس بگیرید",
                telegramTitle: "کانال رسمی تلگرام",
                telegramDesc: "به به‌روزرسانی‌ها و اطلاعیه‌های انجمن بپیوندید"
            }
        };

        function applyServiceLanguage(lang) {
            const elements = document.querySelectorAll('[data-key]');
            elements.forEach(el => {
                const key = el.getAttribute('data-key');
                if (serviceTranslations[lang] && serviceTranslations[lang][key]) {
                    el.textContent = serviceTranslations[lang][key];
                } else if (typeof detailTranslations !== 'undefined' && detailTranslations[lang] && detailTranslations[lang][key]) {
                    el.textContent = detailTranslations[lang][key];
                }
            });
            const sel = document.getElementById('dashLanguageSelect');
            if (sel) sel.value = lang;
        }

        const serviceLang = safeGet('language') || 'en';
        applyServiceLanguage(serviceLang);

        const serviceLangSelect = document.getElementById('dashLanguageSelect');
        if (serviceLangSelect) {
            serviceLangSelect.addEventListener('change', function() {
                const newLang = this.value;
                safeSet('language', newLang);
                applyServiceLanguage(newLang);
                if (typeof applyDetailDirection === 'function') {
                    applyDetailDirection(newLang);
                }
            });
        }
    </script>
</body>
</html>

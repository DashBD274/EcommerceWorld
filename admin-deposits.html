<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Deposit Requests - UMALL247 Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: #f1f5f9; min-height: 100vh; }
        
        .admin-header {
            background: #1e293b; padding: 14px 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 100;
        }
        
        .admin-header-left { display: flex; align-items: center; gap: 12px; }
        .back-btn { color: #f59e0b; font-size: 18px; text-decoration: none; }
        .admin-header h1 { font-size: 17px; font-weight: 800; }
        
        .admin-content { max-width: 900px; margin: 0 auto; padding: 20px; }
        
        .filter-tabs {
            display: flex; gap: 8px; margin-bottom: 20px;
            background: #1e293b; border: 1px solid #334155;
            border-radius: 12px; padding: 5px;
        }
        
        .filter-tab {
            flex: 1; padding: 10px; border-radius: 8px;
            background: transparent; border: none;
            color: #94a3b8; cursor: pointer;
            font-weight: 600; font-size: 13px;
            font-family: inherit;
        }
        
        .filter-tab.active { background: #f59e0b; color: #fff; }
        
        .deposits-list { display: flex; flex-direction: column; gap: 12px; }
        
        .dep-card {
            background: #1e293b; border: 1px solid #334155;
            border-radius: 14px; padding: 16px;
        }
        
        .dep-card.pending { border-left: 4px solid #f59e0b; }
        .dep-card.approved { border-left: 4px solid #10b981; }
        .dep-card.rejected { border-left: 4px solid #ef4444; }
        
        .dep-header {
            display: flex; justify-content: space-between;
            align-items: flex-start; margin-bottom: 12px;
        }
        
        .dep-user { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
        .dep-email { font-size: 11.5px; color: #94a3b8; }
        
        .dep-status {
            padding: 4px 10px; border-radius: 8px;
            font-size: 10.5px; font-weight: 700;
            text-transform: uppercase;
        }
        
        .dep-status.pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .dep-status.approved { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
        .dep-status.rejected { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
        
        .dep-details {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 10px; margin-bottom: 14px;
            background: #0f172a; padding: 14px; border-radius: 10px;
        }
        
        .dep-detail-row { font-size: 12px; }
        .dep-detail-label { color: #64748b; margin-bottom: 3px; }
        .dep-detail-value { font-weight: 700; }
        .dep-detail-value.amount { color: #f59e0b; font-size: 16px; }
        .dep-detail-value.address { 
            font-size: 10px; word-break: break-all; 
            font-family: monospace; color: #cbd5e1; 
        }
        
        .dep-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .dep-btn {
            padding: 12px; border-radius: 10px; border: none;
            font-size: 13px; font-weight: 700;
            cursor: pointer; font-family: inherit;
        }
        
        .dep-btn.approve { background: linear-gradient(90deg, #10b981, #059669); color: #fff; }
        .dep-btn.reject { background: linear-gradient(90deg, #ef4444, #dc2626); color: #fff; }
        .dep-btn:disabled { opacity: 0.5; }
        .dep-btn:active { transform: scale(0.97); }
        
        .loading-state { text-align: center; padding: 40px; color: #94a3b8; }
        .loading-state i { font-size: 32px; color: #f59e0b; display: block; margin-bottom: 12px; }
        
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: #f1f5f9; padding: 14px 22px;
            border-radius: 12px; font-size: 14px; font-weight: 600;
            z-index: 99999; display: none; border: 1px solid #334155;
        }
        .toast.success { border-color: #10b981; color: #6ee7b7; }
        .toast.error { border-color: #ef4444; color: #fca5a5; }
        .toast.show { display: block; }
        
        @media (max-width: 480px) {
            .dep-details { grid-template-columns: 1fr; }
            .admin-header h1 { font-size: 15px; }
        }
    </style>
</head>
<body>

    <header class="admin-header">
        <div class="admin-header-left">
            <a href="admin.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h1>Deposit Requests</h1>
        </div>
        <span id="countBadge" style="font-size:12px; color:#94a3b8;">-- items</span>
    </header>
    
    <div class="admin-content">
        
        <div class="filter-tabs">
            <button class="filter-tab active" data-status="pending">Pending</button>
            <button class="filter-tab" data-status="approved">Approved</button>
            <button class="filter-tab" data-status="rejected">Rejected</button>
            <button class="filter-tab" data-status="all">All</button>
        </div>
        
        <div class="deposits-list" id="depList">
            <div class="loading-state">
                <i class="fa-solid fa-spinner fa-spin"></i>
                Loading deposits...
            </div>
        </div>
        
    </div>
    
    <div class="toast" id="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-auth.js"></script>

    <script>
        let currentFilter = 'pending';
        let allDeposits = [];
        
        // ============================================================
        // 🔐 Admin Auth Check
        // ============================================================
        auth.onAuthStateChanged(async function(user) {
            if (!user) { 
                window.location.replace('admin-login.html'); 
                return; 
            }
            const adminDoc = await db.collection('admins').doc(user.uid).get();
            if (!adminDoc.exists) { 
                await auth.signOut(); 
                window.location.replace('admin-login.html'); 
                return; 
            }
            loadDeposits();
        });
        
        // ============================================================
        // 📥 Load All Deposits
        // ============================================================
        async function loadDeposits() {
            const listEl = document.getElementById('depList');
            try {
                const snap = await db.collection('deposits')
                    .orderBy('createdAt', 'desc')
                    .limit(100)
                    .get();
                
                allDeposits = [];
                snap.forEach(doc => allDeposits.push({ id: doc.id, ...doc.data() }));
                
                document.getElementById('countBadge').textContent = allDeposits.length + ' items';
                renderDeposits();
            } catch (err) {
                console.error('Load error:', err);
                listEl.innerHTML = '<div class="loading-state"><i class="fa-solid fa-circle-exclamation"></i>Failed to load</div>';
            }
        }
        
        // ============================================================
        // 🎨 Render Deposits
        // ============================================================
        function renderDeposits() {
            const listEl = document.getElementById('depList');
            let filtered = allDeposits;
            if (currentFilter !== 'all') {
                filtered = allDeposits.filter(d => d.status === currentFilter);
            }
            
            if (filtered.length === 0) {
                listEl.innerHTML = '<div class="loading-state"><i class="fa-solid fa-inbox"></i>No ' + currentFilter + ' deposits</div>';
                return;
            }
            
            let html = '';
            filtered.forEach(d => {
                const date = d.createdAt && d.createdAt.toDate 
                    ? d.createdAt.toDate().toLocaleString() 
                    : 'N/A';
                
                const actionsHtml = d.status === 'pending' ? `
                    <div class="dep-actions">
                        <button class="dep-btn approve" onclick="processDeposit('${d.id}', 'approved')">
                            <i class="fa-solid fa-check"></i> Approve
                        </button>
                        <button class="dep-btn reject" onclick="processDeposit('${d.id}', 'rejected')">
                            <i class="fa-solid fa-xmark"></i> Reject
                        </button>
                    </div>
                ` : '';
                
                html += `
                    <div class="dep-card ${d.status}">
                        <div class="dep-header">
                            <div>
                                <div class="dep-user">${d.userName || 'Unknown'}</div>
                                <div class="dep-email">${d.userEmail || '-'}</div>
                            </div>
                            <span class="dep-status ${d.status}">${d.status}</span>
                        </div>
                        
                        <div class="dep-details">
                            <div class="dep-detail-row">
                                <div class="dep-detail-label">Amount</div>
                                <div class="dep-detail-value amount">${(d.amount || 0).toFixed(2)} USDT</div>
                            </div>
                            <div class="dep-detail-row">
                                <div class="dep-detail-label">Network</div>
                                <div class="dep-detail-value">${d.network || '-'}</div>
                            </div>
                            <div class="dep-detail-row" style="grid-column: 1 / -1;">
                                <div class="dep-detail-label">Deposit Address</div>
                                <div class="dep-detail-value address">${d.address || '-'}</div>
                            </div>
                            <div class="dep-detail-row" style="grid-column: 1 / -1;">
                                <div class="dep-detail-label">Requested</div>
                                <div class="dep-detail-value" style="font-weight:500;font-size:11px;color:#94a3b8;">${date}</div>
                            </div>
                        </div>
                        
                        ${actionsHtml}
                    </div>
                `;
            });
            
            listEl.innerHTML = html;
        }
        
        // ============================================================
        // 🔄 Filter Tabs
        // ============================================================
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.getAttribute('data-status');
                renderDeposits();
            });
        });
        
        // ============================================================
        // ✅❌ Process Deposit (Approve/Reject)
        // ============================================================
        async function processDeposit(depId, status) {
            if (!confirm(`Are you sure you want to ${status} this deposit?`)) return;
            
            try {
                const depDoc = await db.collection('deposits').doc(depId).get();
                if (!depDoc.exists) { showToast('❌ Not found', 'error'); return; }
                const dep = depDoc.data();
                
                if (dep.status !== 'pending') { 
                    showToast('❌ Already processed', 'error'); 
                    return; 
                }
                
                // Update deposit status
                await db.collection('deposits').doc(depId).update({
                    status: status,
                    processedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    processedBy: auth.currentUser.uid
                });
                
                // ✅ If approved, add balance to user
                if (status === 'approved') {
                    await db.collection('users').doc(dep.uid).update({
                        balance: firebase.firestore.FieldValue.increment(dep.amount || 0)
                    });
                }
                
                // Log transaction
                await db.collection('transactions').add({
                    uid: dep.uid,
                    type: status === 'approved' ? 'deposit_approved' : 'deposit_rejected',
                    amount: dep.amount || 0,
                    status: status,
                    note: `Deposit ${status} by admin (${dep.network || 'N/A'})`,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                showToast(`✅ Deposit ${status}!`, 'success');
                loadDeposits();
            } catch (err) {
                console.error('Process error:', err);
                showToast('❌ Failed. Try again.', 'error');
            }
        }
        
        // ============================================================
        // 🍞 Toast
        // ============================================================
        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type + ' show';
            setTimeout(() => t.className = 'toast ' + type, 3000);
        }
    </script>
</body>
</html>

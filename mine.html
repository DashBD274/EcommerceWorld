    <style>
        /* ================= Mine পেজ ================= */
        .mine-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 16px 16px 30px 16px;
        }

        /* 🟡 প্রোফাইল কার্ড (সোনালী) */
        .profile-card {
            background: linear-gradient(135deg, #f59e0b 0%, #eab308 100%);
            border-radius: 18px;
            padding: 20px;
            color: #fff;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.35);
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 180px;
            height: 180px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            pointer-events: none;
        }

        .profile-card::after {
            content: '';
            position: absolute;
            bottom: -80px;
            left: -40px;
            width: 160px;
            height: 160px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            pointer-events: none;
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            position: relative;
            z-index: 2;
        }

        .profile-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #fff;
            color: #f59e0b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 800;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .profile-info {
            flex: 1;
            min-width: 0;
        }

        .profile-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }

        .profile-name {
            font-size: 17px;
            font-weight: 800;
            margin: 0;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .vip-tag {
            background: rgba(255, 255, 255, 0.28);
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 10.5px;
            font-weight: 700;
            color: #fff;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .vip-tag i {
            font-size: 9px;
        }

        .profile-invite {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.9);
            margin: 0;
        }

        .profile-invite strong {
            color: #fff;
            font-weight: 700;
        }

        .profile-qr {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
        }

        /* ব্যালেন্স ও বাটন */
        .profile-balance-row {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 10px;
            position: relative;
            z-index: 2;
            flex-wrap: wrap;
        }

        .balance-block {
            flex: 1;
            min-width: 120px;
        }

        .balance-label-sm {
            font-size: 11.5px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .balance-value-sm {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .balance-value-sm .unit {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
        }

        .balance-value-sm .amount {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .profile-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .profile-btn {
            background: rgba(255, 255, 255, 0.95);
            color: #e65c00;
            border: none;
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: transform 0.2s;
            min-width: 72px;
        }

        .profile-btn:active {
            transform: scale(0.95);
        }

        .profile-btn i {
            font-size: 16px;
        }

        /* 🔵 দ্রুত অ্যাকশন (Record, Wallet, Invitation) */
        .quick-actions-mine {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: var(--card);
            padding: 16px 12px;
            border-radius: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .qa-item {
            background: transparent;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            padding: 4px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .qa-icon {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: transform 0.2s;
        }

        .qa-item:active .qa-icon {
            transform: scale(0.9);
        }

        .qa-icon.blue {
            background: #dbeafe;
            color: #3b82f6;
        }

        .qa-icon.orange {
            background: #fed7aa;
            color: #f97316;
        }

        .qa-icon.purple {
            background: #e9d5ff;
            color: #a855f7;
        }

        body.dark-mode .qa-icon.blue { background: rgba(59, 130, 246, 0.15); }
        body.dark-mode .qa-icon.orange { background: rgba(249, 115, 22, 0.15); }
        body.dark-mode .qa-icon.purple { background: rgba(168, 85, 247, 0.15); }

        /* 📋 মেনু লিস্ট */
        .menu-list {
            background: var(--card);
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            margin-bottom: 20px;
        }

        .menu-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            transition: background-color 0.15s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            font-family: inherit;
            background: transparent;
            border-left: none;
            border-right: none;
            border-top: none;
            width: 100%;
            text-align: left;
        }

        .menu-row:last-child {
            border-bottom: none;
        }

        .menu-row:active {
            background: var(--bg);
        }

        .menu-row-icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }

        .menu-row-icon.profile { color: #3b82f6; }
        .menu-row-icon.deposit { color: #10b981; }
        .menu-row-icon.withdrawal { color: #f59e0b; }
        .menu-row-icon.theme { color: #a855f7; }
        .menu-row-icon.logout { color: #ef4444; }

        .menu-row-text {
            flex: 1;
            font-size: 14.5px;
            font-weight: 500;
            color: var(--text);
        }

        .menu-row-arrow {
            color: var(--text-light);
            font-size: 13px;
            flex-shrink: 0;
        }

        /* ভার্সন */
        .system-version {
            text-align: center;
            font-size: 12px;
            color: var(--text-light);
            margin-top: 20px;
            margin-bottom: 10px;
        }

        /* RTL */
        body.rtl .menu-row {
            flex-direction: row-reverse;
            text-align: right;
        }

        body.rtl .menu-row-arrow {
            transform: rotate(180deg);
        }

        body.rtl .profile-top {
            flex-direction: row-reverse;
        }

        body.rtl .profile-balance-row {
            flex-direction: row-reverse;
        }

        /* মোবাইল */
        @media (max-width: 360px) {
            .profile-card { padding: 16px; }
            .profile-avatar { width: 46px; height: 46px; font-size: 21px; }
            .profile-name { font-size: 15px; }
            .balance-value-sm .amount { font-size: 24px; }
            .profile-btn { padding: 8px 12px; font-size: 10px; min-width: 62px; }
            .profile-btn i { font-size: 14px; }
            .qa-icon { width: 40px; height: 40px; font-size: 17px; }
            .qa-item { font-size: 11px; }
            .menu-row { padding: 14px 15px; }
            .menu-row-text { font-size: 13.5px; }
        }

        // অনুবাদ প্রয়োগ
        function applyMineLanguage(lang) {
            const elements = document.querySelectorAll('[data-key]');
            elements.forEach(el => {
                const key = el.getAttribute('data-key');
                if (mineTranslations[lang] && mineTranslations[lang][key]) {
                    el.textContent = mineTranslations[lang][key];
                } else if (typeof detailTranslations !== 'undefined' && detailTranslations[lang] && detailTranslations[lang][key]) {
                    el.textContent = detailTranslations[lang][key];
                }
            });
            const sel = document.getElementById('dashLanguageSelect');
            if (sel) sel.value = lang;
        }

        // প্রাথমিক লোড
        const mineLang = safeGet('language') || 'en';
        applyMineLanguage(mineLang);

        // ভাষা পরিবর্তন
        const mineLangSelect = document.getElementById('dashLanguageSelect');
        if (mineLangSelect) {
            mineLangSelect.addEventListener('change', function() {
                const newLang = this.value;
                safeSet('language', newLang);
                applyMineLanguage(newLang);
                if (typeof applyDetailDirection === 'function') {
                    applyDetailDirection(newLang);
                }
            });
        }

        // ================= Logout =================
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', function() {
                if (confirm('Are you sure you want to log out?')) {
                    window.location.href = 'index.html';
                }
            });
        }

        // ================= Theme Setting Button =================
        const themeSettingBtn = document.getElementById('themeSettingBtn');
        if (themeSettingBtn) {
            themeSettingBtn.addEventListener('click', function() {
                const isDark = !document.body.classList.contains('dark-mode');
                if (typeof applyDetailTheme === 'function') {
                    applyDetailTheme(isDark);
                }
                safeSet('theme', isDark ? 'dark' : 'light');
            });
        }
    </script>
</body>
</html>

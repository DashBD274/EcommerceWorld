<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#b0bec5">
    <title>Forgot Password - UMALL247</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="top-controls">
        <div class="lang-selector">
            <i class="fa-solid fa-globe"></i>
            <select id="languageSelect">
                <option value="en">US English</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
                <option value="pt">Português</option>
                <option value="nl">Nederlands</option>
                <option value="ru">Русский</option>
                <option value="tr">Türkçe</option>
                <option value="ar">العربية</option>
                <option value="fa">فارسی</option>
            </select>
        </div>
        <button id="themeToggle" class="theme-toggle" type="button">
            <i class="fa-solid fa-moon"></i>
        </button>
    </div>

    <div class="login-container">
        <h2 data-key="forgotTitle">Forgot Password?</h2>
        <p class="subtitle" data-key="forgotSubtitle">Enter your email address and we'll send you a link to reset your password.</p>

        <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input type="email" id="emailInput" placeholder="Email Address" data-key="emailPlaceholder" autocomplete="email">
        </div>

        <div id="messageBox" style="display:none; padding:10px 14px; border-radius:10px; font-size:13px; margin-bottom:14px; text-align:center; font-weight:600;"></div>

        <button class="login-btn" type="button" id="resetBtn" data-key="sendResetBtn">Send Reset Link</button>

        <p class="signup-link">
            <a href="index.html" data-key="backToSignIn">← Back to Sign In</a>
        </p>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-box" id="loadingBox">
            <div class="loading-spinner"><i class="fa-solid fa-circle-notch fa-spin"></i></div>
            <div class="loading-success"><i class="fa-solid fa-circle-check"></i></div>
            <p class="loading-text" id="loadingText">Sending reset link...</p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script src="firebase-auth.js"></script>
    <script src="script.js"></script>

    <script>
        // ================= Translations (Forgot Password) =================
        const forgotTranslations = {
            en: { forgotTitle: "Forgot Password?", forgotSubtitle: "Enter your email address and we'll send you a link to reset your password.", sendResetBtn: "Send Reset Link", backToSignIn: "← Back to Sign In" },
            es: { forgotTitle: "¿Olvidaste tu contraseña?", forgotSubtitle: "Ingrese su correo electrónico y le enviaremos un enlace para restablecer su contraseña.", sendResetBtn: "Enviar enlace", backToSignIn: "← Volver a iniciar sesión" },
            fr: { forgotTitle: "Mot de passe oublié ?", forgotSubtitle: "Entrez votre adresse e-mail et nous vous enverrons un lien pour réinitialiser votre mot de passe.", sendResetBtn: "Envoyer le lien", backToSignIn: "← Retour à la connexion" },
            de: { forgotTitle: "Passwort vergessen?", forgotSubtitle: "Geben Sie Ihre E-Mail-Adresse ein und wir senden Ihnen einen Link zum Zurücksetzen Ihres Passworts.", sendResetBtn: "Link senden", backToSignIn: "← Zurück zur Anmeldung" },
            it: { forgotTitle: "Password dimenticata?", forgotSubtitle: "Inserisci il tuo indirizzo email e ti invieremo un link per reimpostare la password.", sendResetBtn: "Invia link", backToSignIn: "← Torna al login" },
            pt: { forgotTitle: "Esqueceu a senha?", forgotSubtitle: "Digite seu endereço de e-mail e enviaremos um link para redefinir sua senha.", sendResetBtn: "Enviar link", backToSignIn: "← Voltar ao login" },
            nl: { forgotTitle: "Wachtwoord vergeten?", forgotSubtitle: "Voer uw e-mailadres in en we sturen u een link om uw wachtwoord opnieuw in te stellen.", sendResetBtn: "Link verzenden", backToSignIn: "← Terug naar inloggen" },
            ru: { forgotTitle: "Забыли пароль?", forgotSubtitle: "Введите свой адрес электронной почты, и мы отправим вам ссылку для сброса пароля.", sendResetBtn: "Отправить ссылку", backToSignIn: "← Назад к входу" },
            tr: { forgotTitle: "Şifremi unuttum?", forgotSubtitle: "E-posta adresinizi girin, size şifrenizi sıfırlamak için bir bağlantı gönderelim.", sendResetBtn: "Bağlantı gönder", backToSignIn: "← Girişe dön" },
            ar: { forgotTitle: "هل نسيت كلمة المرور؟", forgotSubtitle: "أدخل بريدك الإلكتروني وسنرسل لك رابطًا لإعادة تعيين كلمة المرور.", sendResetBtn: "إرسال الرابط", backToSignIn: "→ العودة لتسجيل الدخول" },
            fa: { forgotTitle: "رمز عبور را فراموش کرده اید؟", forgotSubtitle: "آدرس ایمیل خود را وارد کنید تا لینک بازیابی رمز عبور را برایتان ارسال کنیم.", sendResetBtn: "ارسال لینک", backToSignIn: "→ بازگشت به ورود" }
        };

        // Apply forgot translations
        function applyForgotLanguage(lang) {
            const tr = forgotTranslations[lang] || forgotTranslations.en;
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (tr[key]) {
                    if (el.tagName === 'INPUT') el.placeholder = tr[key];
                    else el.textContent = tr[key];
                } else if (typeof translations !== 'undefined' && translations[lang] && translations[lang][key]) {
                    if (el.tagName === 'INPUT') el.placeholder = translations[lang][key];
                    else el.textContent = translations[lang][key];
                }
            });
        }

        const savedLang = safeGet('language') || 'en';
        applyForgotLanguage(savedLang);

        // Language select sync
        const langSel = document.getElementById('languageSelect');
        if (langSel) {
            langSel.value = savedLang;
            langSel.addEventListener('change', function() {
                const newLang = this.value;
                safeSet('language', newLang);
                applyForgotLanguage(newLang);
                if (typeof applyDirection === 'function') {
                    applyDirection(newLang);
                }
            });
        }

        // ================= Message / Loading =================
        const resetBtn = document.getElementById('resetBtn');
        const messageBox = document.getElementById('messageBox');

        function showMessage(text, isError) {
            messageBox.style.display = 'block';
            messageBox.textContent = text;
            if (isError) {
                messageBox.style.background = '#fee2e2';
                messageBox.style.color = '#dc2626';
                messageBox.style.border = '1px solid #fecaca';
            } else {
                messageBox.style.background = '#d1fae5';
                messageBox.style.color = '#059669';
                messageBox.style.border = '1px solid #a7f3d0';
            }
        }

        function showLoading(text) {
            const overlay = document.getElementById('loadingOverlay');
            const textEl = document.getElementById('loadingText');
            const box = document.getElementById('loadingBox');
            if (box) box.classList.remove('success');
            if (textEl) textEl.textContent = text;
            if (overlay) overlay.classList.add('show');
        }

        function hideLoading() {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) overlay.classList.remove('show');
        }

        function showSuccess(text) {
            const box = document.getElementById('loadingBox');
            const textEl = document.getElementById('loadingText');
            if (box) box.classList.add('success');
            if (textEl) textEl.textContent = text;
        }

        // ================= 🔐 Send Reset Email =================
        resetBtn.addEventListener('click', async function() {
            const email = document.getElementById('emailInput').value.trim();

            if (!email) {
                showMessage('❌ Please enter your email address.', true);
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showMessage('❌ Please enter a valid email address.', true);
                return;
            }

            resetBtn.disabled = true;
            resetBtn.style.opacity = '0.7';
            messageBox.style.display = 'none';

            showLoading('Sending reset link...');

            const result = await sendPasswordReset(email);

            if (result.success) {
                showSuccess('Reset link sent!');
                setTimeout(() => {
                    hideLoading();
                    showMessage('✅ Password reset link sent to ' + email + '. Please check your inbox and spam folder.', false);
                    resetBtn.disabled = false;
                    resetBtn.style.opacity = '1';
                }, 1500);
            } else {
                hideLoading();
                resetBtn.disabled = false;
                resetBtn.style.opacity = '1';
                showMessage('❌ ' + translateFirebaseError(result.error), true);
            }
        });

        // Enter key
        document.getElementById('emailInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') resetBtn.click();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#b0bec5">
    <title>Sign In - UMALL247</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="top-controls">
        <div class="lang-selector">
            <i class="fa-solid fa-globe"></i>
            <select id="languageSelect">
                <option value="en">US English</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
                <option value="pt">Português</option>
                <option value="nl">Nederlands</option>
                <option value="ru">Русский</option>
                <option value="tr">Türkçe</option>
                <option value="ar">العربية</option>
                <option value="fa">فارسی</option>
            </select>
        </div>
        <button id="themeToggle" class="theme-toggle" type="button">
            <i class="fa-solid fa-moon"></i>
        </button>
    </div>

    <div class="login-container">
        <h2 data-key="signIn">Sign In</h2>
        <p class="subtitle" data-key="subtitle">Welcome back! Enter your credentials to access your account</p>

        <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input type="email" id="emailInput" placeholder="Email Address" data-key="emailPlaceholder" autocomplete="email">
        </div>

        <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="passwordInput" placeholder="Password" data-key="passwordPlaceholder" autocomplete="current-password">
            <i class="fa-solid fa-eye eye-icon"></i>
        </div>

        <div class="verify-group">
            <input type="text" id="verifyInput" class="verify-input" placeholder="Verification" data-key="verifyPlaceholder" maxlength="4" inputmode="numeric" autocomplete="off">
            <div class="verify-code" id="verifyCode">----</div>
        </div>

        <div class="options">
            <label>
                <input type="checkbox"> <span data-key="remember">Remember password</span>
            </label>
            <a href="#" data-key="forgot">Forgot Password?</a>
        </div>

        <div id="messageBox" style="display:none; padding:10px 14px; border-radius:10px; font-size:13px; margin-bottom:14px; text-align:center; font-weight:600;"></div>

        <button class="login-btn" type="button" id="loginBtn" data-key="loginBtn">Login</button>

        <p class="signup-link">
            <span data-key="noAccount">Don't have an account?</span> 
            <a href="signup.html" data-key="signUp">Sign Up</a>
        </p>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-box" id="loadingBox">
            <div class="loading-spinner"><i class="fa-solid fa-circle-notch fa-spin"></i></div>
            <div class="loading-success"><i class="fa-solid fa-circle-check"></i></div>
            <p class="loading-text" id="loadingText">Verifying your email...</p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script src="firebase-auth.js"></script>
    <script src="script.js"></script>

    <script>
    // ============================================================
    // 🔢 Verification Code জেনারেট
    // ============================================================
    var currentVerifyCode = "";

    function generateVerifyCode() {
        currentVerifyCode = String(Math.floor(1000 + Math.random() * 9000));
        var el = document.getElementById('verifyCode');
        if (el) el.textContent = currentVerifyCode.split('').join(' ');
        console.log('✅ New verify code:', currentVerifyCode);
    }

    // পেজ লোড হওয়ার সাথে সাথেই
    generateVerifyCode();

    // Verification input — শুধু ৪ সংখ্যা
    var verifyInputEl = document.getElementById('verifyInput');
    if (verifyInputEl) {
        verifyInputEl.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').substring(0, 4);
        });
    }

    // ============================================================
    // 💬 Message দেখানোর Function
    // ============================================================
    function showMessage(text, isError) {
        var box = document.getElementById('messageBox');
        if (!box) return;
        box.style.display = 'block';
        box.textContent = text;
        if (isError) {
            box.style.background = '#fee2e2';
            box.style.color = '#dc2626';
            box.style.border = '1px solid #fecaca';
        } else {
            box.style.background = '#d1fae5';
            box.style.color = '#059669';
            box.style.border = '1px solid #a7f3d0';
        }
    }

    function hideMessage() {
        var box = document.getElementById('messageBox');
        if (box) box.style.display = 'none';
    }

    // ============================================================
    // ⏳ Loading Functions
    // ============================================================
    var loadingTimeoutId = null;

    function showLoading(text) {
        var loadingBox = document.getElementById('loadingBox');
        var loadingText = document.getElementById('loadingText');
        var loadingOverlay = document.getElementById('loadingOverlay');

        if (loadingBox) loadingBox.classList.remove('success');
        if (loadingText) loadingText.textContent = text || 'Please wait...';
        if (loadingOverlay) loadingOverlay.classList.add('show');

        if (loadingTimeoutId) clearTimeout(loadingTimeoutId);
        loadingTimeoutId = setTimeout(function() {
            console.log('⏱️ Loading timeout');
            hideLoading();
            showMessage('Request timed out. Please try again.', true);
        }, 10000);
    }

    function hideLoading() {
        if (loadingTimeoutId) {
            clearTimeout(loadingTimeoutId);
            loadingTimeoutId = null;
        }
        var loadingOverlay = document.getElementById('loadingOverlay');
        if (loadingOverlay) loadingOverlay.classList.remove('show');
    }

    function showSuccess(text) {
        if (loadingTimeoutId) {
            clearTimeout(loadingTimeoutId);
            loadingTimeoutId = null;
        }
        var loadingBox = document.getElementById('loadingBox');
        var loadingText = document.getElementById('loadingText');
        if (loadingBox) loadingBox.classList.add('success');
        if (loadingText) loadingText.textContent = text || 'Success!';
    }

    // ============================================================
    // 🔐 Login Button Handler
    // ============================================================
    var loginBtn = document.getElementById('loginBtn');

    loginBtn.addEventListener('click', function() {
        var email = document.getElementById('emailInput').value.trim();
        var password = document.getElementById('passwordInput').value;
        var verifyCode = document.getElementById('verifyInput').value.trim();

        console.log('========== LOGIN ATTEMPT ==========');
        console.log('Email:', email);
        console.log('Password length:', password.length);
        console.log('Entered Code:', verifyCode);
        console.log('Expected Code:', currentVerifyCode);

        // ==========================================
        // 🔴 STEP 1: Email Check (সবচেয়ে আগে)
        // ==========================================
        if (!email) {
            showMessage('❌ Please enter your email address.', true);
            console.log('❌ Email empty — STOP');
            return;   // ← এখানেই থেমে যাবে
        }

        var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            showMessage('❌ Please enter a valid email address.', true);
            console.log('❌ Email invalid — STOP');
            return;
        }

        // ==========================================
        // 🔴 STEP 2: Password Check
        // ==========================================
        if (!password) {
            showMessage('❌ Please enter your password.', true);
            console.log('❌ Password empty — STOP');
            return;
        }

        if (password.length < 6) {
            showMessage('❌ Password must be at least 6 characters.', true);
            console.log('❌ Password too short — STOP');
            return;
        }

        // ==========================================
        // 🔴 STEP 3: Verification Code Check
        // ==========================================
        if (!verifyCode) {
            showMessage('❌ Please enter the verification code.', true);
            console.log('❌ Verify code empty — STOP');
            return;
        }

        if (verifyCode.length !== 4) {
            showMessage('❌ Verification code must be 4 digits.', true);
            console.log('❌ Verify code not 4 digits — STOP');
            return;
        }

        if (verifyCode !== currentVerifyCode) {
            showMessage('❌ Incorrect verification code. Please try again.', true);
            console.log('❌ Verify code mismatch — STOP');
            generateVerifyCode();
            document.getElementById('verifyInput').value = '';
            return;
        }

        // ==========================================
        // ✅ সব Check পাস — এখন Firebase Login
        // ==========================================
        console.log('✅ All validations passed — calling Firebase');

        loginBtn.disabled = true;
        loginBtn.style.opacity = '0.7';
        hideMessage();

        var lang = (typeof safeGet === 'function') ? (safeGet('language') || 'en') : 'en';
        var t = (typeof translations !== 'undefined' && translations[lang])
            ? translations[lang]
            : { verifying: 'Signing in...', verified: 'Welcome back!' };

        showLoading(t.verifying || 'Signing in...');

        try {
            loginUser(email, password).then(function(result) {
                console.log('Login result:', result);

                if (result && result.success) {
                    showSuccess(t.verified || 'Welcome back!');
                    setTimeout(function() {
                        window.location.replace('dashboard.html');
                    }, 1500);
                } else {
                    hideLoading();
                    loginBtn.disabled = false;
                    loginBtn.style.opacity = '1';
                    var errMsg = (result && result.error) ? translateFirebaseError(result.error) : '❌ Login failed. Please try again.';
                    showMessage(errMsg, true);
                    generateVerifyCode();
                    document.getElementById('verifyInput').value = '';
                }
            }).catch(function(err) {
                console.error('Login error:', err);
                hideLoading();
                loginBtn.disabled = false;
                loginBtn.style.opacity = '1';
                showMessage('❌ Network error. Please check your connection.', true);
            });
        } catch (err) {
            console.error('Exception:', err);
            hideLoading();
            loginBtn.disabled = false;
            loginBtn.style.opacity = '1';
            showMessage('❌ Something went wrong. Please try again.', true);
        }
    });

    // ============================================================
    // ⌨️ Enter Key Navigation
    // ============================================================
    document.getElementById('emailInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') document.getElementById('passwordInput').focus();
    });
    document.getElementById('passwordInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') document.getElementById('verifyInput').focus();
    });
    document.getElementById('verifyInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') loginBtn.click();
    });
    </script>
</body>
</html>

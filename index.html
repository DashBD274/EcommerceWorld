<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#b0bec5">
    <title>Sign In Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- উপরের ডানদিকে ভাষা ও থিম বাটন -->
    <div class="top-controls">
        <div class="lang-selector">
            <i class="fa-solid fa-globe"></i>
            <select id="languageSelect">
                <option value="en">US English</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
                <option value="pt">Português</option>
                <option value="nl">Nederlands</option>
                <option value="ru">Русский</option>
                <option value="tr">Türkçe</option>
                <option value="ar">العربية</option>
                <option value="fa">فارسی</option>
            </select>
        </div>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">
            <i class="fa-solid fa-moon"></i>
        </button>
    </div>

    <!-- মূল লগইন কার্ড -->
    <div class="login-container">
        <h2 data-key="signIn">Sign In</h2>
        <p class="subtitle" data-key="subtitle">Welcome back! Enter your credentials to access your account</p>

        <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input type="email" placeholder="Email Address" data-key="emailPlaceholder">
        </div>

        <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" placeholder="Password" data-key="passwordPlaceholder">
            <i class="fa-solid fa-eye eye-icon"></i>
        </div>

        <div class="verify-group">
            <input type="text" class="verify-input" placeholder="Verification" readonly data-key="verifyPlaceholder">
            <div class="verify-code" id="verifyCode">8 6 6 4</div>
        </div>

        <div class="options">
            <label>
                <input type="checkbox"> <span data-key="remember">Remember password</span>
            </label>
            <a href="#" data-key="forgot">Forgot Password?</a>
        </div>

        <button class="login-btn" type="button" data-key="loginBtn">Login</button>

        <p class="signup-link">
            <span data-key="noAccount">Don't have an account?</span> 
            <a href="signup.html" data-key="signUp">Sign Up</a>
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Sign In - UMALL247</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Splash Screen CSS -->
    <style>
        /* ================= Splash Screen ================= */
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            opacity: 1;
            transition: opacity 0.4s ease-out;
        }

        #splashScreen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* 🎬 লোগো কন্টেইনার */
        .splash-logo-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        /* 🎨 সব লোগোর কমন স্টাইল — সাদা background */
        .splash-logo-img {
            background: #ffffff;
            border-radius: 20px;
            padding: 15px 22px;
            box-shadow: 0 8px 30px rgba(255, 153, 0, 0.4);
            object-fit: contain;
        }

        /* 🔼 উপরের লোগো — Amazon Cart */
        .splash-basket-logo {
            width: 130px;
            height: 130px;
            animation: basketGrow 2.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            transform: scale(0.1);
            opacity: 0;
        }

        @keyframes basketGrow {
            0% {
                transform: scale(0.1);
                opacity: 0;
            }
            30% {
                transform: scale(1.15);
                opacity: 1;
            }
            50% {
                transform: scale(1);
                opacity: 1;
            }
            70% {
                transform: scale(1.08);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 🔽 নিচের লোগো — Amazon Text Logo */
        .splash-seller-logo {
            width: 200px;
            height: auto;
            animation: sellerAppear 1s ease-out 1.2s forwards;
            transform: scale(0.5);
            opacity: 0;
        }

        @keyframes sellerAppear {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            60% {
                transform: scale(1.08);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 🎁 Splash Screen থেকে কন্টেন্ট দেখানো */
        #mainContent {
            opacity: 0;
            transition: opacity 0.4s ease-in;
        }

        #mainContent.show {
            opacity: 1;
        }

        /* 📱 Mobile */
        @media (max-width: 480px) {
            .splash-logo-wrap { gap: 25px; }
            .splash-basket-logo { width: 110px; height: 110px; padding: 12px 18px; }
            .splash-seller-logo { width: 170px; }
        }

        @media (max-width: 360px) {
            .splash-logo-wrap { gap: 20px; }
            .splash-basket-logo { width: 90px; height: 90px; padding: 10px 14px; }
            .splash-seller-logo { width: 140px; }
        }
    </style>
</head>
<body>

    <!-- ============================================================
         🎬 SPLASH SCREEN — ২টি Amazon লোগো (সাদা background)
         ============================================================ -->
    <div id="splashScreen">
        <div class="splash-logo-wrap">
            
            <!-- 🔼 উপরের লোগো: Amazon Cart (সাদা BG) -->
            <img 
                src="https://upload.wikimedia.org/wikipedia/commons/d/de/Amazon_icon.png" 
                alt="Amazon Cart" 
                class="splash-logo-img splash-basket-logo"
            >

            <!-- 🔽 নিচের লোগো: Amazon Text (সাদা BG) -->
            <img 
                src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" 
                alt="Amazon" 
                class="splash-logo-img splash-seller-logo"
            >
        </div>
    </div>

    <!-- ============================================================
         📱 MAIN CONTENT (Sign In)
         ============================================================ -->
    <div id="mainContent">

        <div class="top-controls">
            <div class="lang-selector">
                <i class="fa-solid fa-globe"></i>
                <select id="languageSelect">
                    <option value="en">US English</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="it">Italiano</option>
                    <option value="pt">Português</option>
                    <option value="nl">Nederlands</option>
                    <option value="ru">Русский</option>
                    <option value="tr">Türkçe</option>
                    <option value="ar">العربية</option>
                    <option value="fa">فارسی</option>
                </select>
            </div>
            <button id="themeToggle" class="theme-toggle" type="button">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>

        <div class="login-container">
            <h2 data-key="signIn">Sign In</h2>
            <p class="subtitle" data-key="subtitle">Welcome back! Enter your credentials to access your account</p>

            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="email" id="emailInput" placeholder="Email Address" data-key="emailPlaceholder" autocomplete="email">
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="passwordInput" placeholder="Password" data-key="passwordPlaceholder" autocomplete="current-password">
                <i class="fa-solid fa-eye eye-icon"></i>
            </div>

            <div class="verify-group">
                <input type="text" id="verifyInput" class="verify-input" placeholder="Verification" data-key="verifyPlaceholder" maxlength="4" inputmode="numeric" autocomplete="off">
                <div class="verify-code" id="verifyCode">----</div>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox"> <span data-key="remember">Remember password</span>
                </label>
                <a href="forgot-password.html" data-key="forgot">Forgot Password?</a>
            </div>

            <div id="messageBox" style="display:none; padding:10px 14px; border-radius:10px; font-size:13px; margin-bottom:14px; text-align:center; font-weight:600;"></div>

            <button class="login-btn" type="button" id="loginBtn" data-key="loginBtn">Login</button>

            <p class="signup-link">
                <span data-key="noAccount">Don't have an account?</span> 
                <a href="signup.html" data-key="signUp">Sign Up</a>
            </p>
        </div>

        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-box" id="loadingBox">
                <div class="loading-spinner"><i class="fa-solid fa-circle-notch fa-spin"></i></div>
                <div class="loading-success"><i class="fa-solid fa-circle-check"></i></div>
                <p class="loading-text" id="loadingText">Verifying your email...</p>
            </div>
        </div>

    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script src="firebase-auth.js"></script>
    <script src="script.js"></script>

    <script>
        // ============================================================
        // 🎬 SPLASH SCREEN LOGIC
        // ============================================================
        (function() {
            const splashScreen = document.getElementById('splashScreen');
            const mainContent = document.getElementById('mainContent');

            setTimeout(function() {
                splashScreen.classList.add('fade-out');
                mainContent.classList.add('show');
                
                setTimeout(function() {
                    if (splashScreen.parentNode) {
                        splashScreen.parentNode.removeChild(splashScreen);
                    }
                }, 500);
            }, 3000);
        })();

        // ============================================================
        // 📝 Verification Code
        // ============================================================
        let currentVerifyCode = "";

        function generateVerifyCode() {
            currentVerifyCode = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('verifyCode').textContent = currentVerifyCode.split('').join(' ');
        }

        setTimeout(generateVerifyCode, 3000);

        const verifyInput = document.getElementById('verifyInput');
        verifyInput.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').substring(0, 4);
        });

        // ============================================================
        // Message / Loading Helper
        // ============================================================
        const loginBtn = document.getElementById('loginBtn');
        const messageBox = document.getElementById('messageBox');

        function showMessage(text, isError) {
            messageBox.style.display = 'block';
            messageBox.textContent = text;
            if (isError) {
                messageBox.style.background = '#fee2e2';
                messageBox.style.color = '#dc2626';
                messageBox.style.border = '1px solid #fecaca';
            } else {
                messageBox.style.background = '#d1fae5';
                messageBox.style.color = '#059669';
                messageBox.style.border = '1px solid #a7f3d0';
            }
        }

        function hideMessage() {
            messageBox.style.display = 'none';
        }

        function showLoading(text) {
            const loadingOverlay = document.getElementById('loadingOverlay');
            const loadingText = document.getElementById('loadingText');
            const loadingBox = document.getElementById('loadingBox');
            
            if (loadingBox) loadingBox.classList.remove('success');
            if (loadingText) loadingText.textContent = text || 'Please wait...';
            if (loadingOverlay) loadingOverlay.classList.add('show');
        }

        function hideLoading() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            if (loadingOverlay) loadingOverlay.classList.remove('show');
        }

        function showSuccess(text) {
            const loadingBox = document.getElementById('loadingBox');
            const loadingText = document.getElementById('loadingText');
            if (loadingBox) loadingBox.classList.add('success');
            if (loadingText) loadingText.textContent = text || 'Success!';
        }

        // ============================================================
        // 🔐 Login Handler
        // ============================================================
        loginBtn.addEventListener('click', async function() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const verifyCode = document.getElementById('verifyInput').value.trim();

            if (!email) return showMessage('❌ Please enter your email address.', true);
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) return showMessage('❌ Please enter a valid email address.', true);

            if (!password) return showMessage('❌ Please enter your password.', true);
            if (password.length < 6) return showMessage('❌ Password must be at least 6 characters.', true);

            if (!verifyCode) return showMessage('❌ Please enter the verification code.', true);
            if (verifyCode.length !== 4) return showMessage('❌ Verification code must be 4 digits.', true);
            if (verifyCode !== currentVerifyCode) {
                showMessage('❌ Incorrect verification code. Please try again.', true);
                generateVerifyCode();
                document.getElementById('verifyInput').value = '';
                return;
            }

            loginBtn.disabled = true;
            loginBtn.style.opacity = '0.7';
            hideMessage();

            const lang = safeGet('language') || 'en';
            const t = (typeof translations !== 'undefined' && translations[lang])
                ? translations[lang]
                : { verifying: 'Signing in...', verified: 'Welcome back!' };

            showLoading(t.verifying || 'Signing in...');

            try {
                const result = await loginUser(email, password);

                if (result.success) {
                    showSuccess(t.verified || 'Welcome back!');
                    setTimeout(() => {
                        window.location.replace('dashboard.html');
                    }, 1500);
                } else {
                    loginBtn.disabled = false;
                    loginBtn.style.opacity = '1';
                    hideLoading();
                    showMessage('❌ ' + translateFirebaseError(result.error), true);
                    generateVerifyCode();
                    document.getElementById('verifyInput').value = '';
                }
            } catch (err) {
                console.error('Login error:', err);
                loginBtn.disabled = false;
                loginBtn.style.opacity = '1';
                hideLoading();
                showMessage('❌ Something went wrong. Please try again.', true);
                generateVerifyCode();
                document.getElementById('verifyInput').value = '';
            }
        });

        // Enter key navigation
        document.getElementById('emailInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('passwordInput').focus();
        });
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('verifyInput').focus();
        });
        document.getElementById('verifyInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') loginBtn.click();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#b0bec5">
    <title>Sign In - UMALL247</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="top-controls">
        <div class="lang-selector">
            <i class="fa-solid fa-globe"></i>
            <select id="languageSelect">
                <option value="en">US English</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
                <option value="pt">Português</option>
                <option value="nl">Nederlands</option>
                <option value="ru">Русский</option>
                <option value="tr">Türkçe</option>
                <option value="ar">العربية</option>
                <option value="fa">فارسی</option>
            </select>
        </div>
        <button id="themeToggle" class="theme-toggle" type="button">
            <i class="fa-solid fa-moon"></i>
        </button>
    </div>

    <div class="login-container">
        <h2 data-key="signIn">Sign In</h2>
        <p class="subtitle" data-key="subtitle">Welcome back! Enter your credentials to access your account</p>

        <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input type="email" id="emailInput" placeholder="Email Address" data-key="emailPlaceholder" autocomplete="email">
        </div>

        <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="passwordInput" placeholder="Password" data-key="passwordPlaceholder" autocomplete="current-password">
            <i class="fa-solid fa-eye eye-icon"></i>
        </div>

        <div class="verify-group">
            <input type="text" id="verifyInput" class="verify-input" placeholder="Verification" data-key="verifyPlaceholder" maxlength="4" inputmode="numeric">
            <div class="verify-code" id="verifyCode">8 6 6 4</div>
        </div>

        <div class="options">
            <label>
                <input type="checkbox"> <span data-key="remember">Remember password</span>
            </label>
            <a href="#" data-key="forgot">Forgot Password?</a>
        </div>

        <div id="messageBox" style="display:none; padding:10px 14px; border-radius:10px; font-size:13px; margin-bottom:14px; text-align:center; font-weight:600;"></div>

        <button class="login-btn" type="button" id="loginBtn" data-key="loginBtn">Login</button>

        <p class="signup-link">
            <span data-key="noAccount">Don't have an account?</span> 
            <a href="signup.html" data-key="signUp">Sign Up</a>
        </p>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-box" id="loadingBox">
            <div class="loading-spinner"><i class="fa-solid fa-circle-notch fa-spin"></i></div>
            <div class="loading-success"><i class="fa-solid fa-circle-check"></i></div>
            <p class="loading-text" id="loadingText">Verifying your email...</p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script src="firebase-auth.js"></script>
    <script src="script.js"></script>

    <script>
        // ================= 🔢 Verification Code Setup =================
        let currentVerifyCode = "";

        function generateVerifyCode() {
            currentVerifyCode = Math.floor(1000 + Math.random() * 9000).toString();
            const verifyDisplay = document.getElementById('verifyCode');
            verifyDisplay.textContent = currentVerifyCode.split('').join(' ');
        }

        // প্রথমে কোড জেনারেট করুন
        generateVerifyCode();

        // ================= 📝 Verification Input =================
        const verifyInput = document.getElementById('verifyInput');
        verifyInput.addEventListener('input', function(e) {
            // শুধু সংখ্যা allow করুন
            this.value = this.value.replace(/\D/g, '').substring(0, 4);
        });

        // ================= 💬 Message Display =================
        const loginBtn = document.getElementById('loginBtn');
        const messageBox = document.getElementById('messageBox');

        function showMessage(text, isError) {
            messageBox.style.display = 'block';
            messageBox.textContent = text;
            if (isError) {
                messageBox.style.background = '#fee2e2';
                messageBox.style.color = '#dc2626';
                messageBox.style.border = '1px solid #fecaca';
            } else {
                messageBox.style.background = '#d1fae5';
                messageBox.style.color = '#059669';
                messageBox.style.border = '1px solid #a7f3d0';
            }
        }

        // ================= 🔐 Login Handler =================
        loginBtn.addEventListener('click', async function() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const verifyCode = document.getElementById('verifyInput').value.trim();

            // ============ Validation ============
            if (!email) {
                showMessage('Please enter your email address.', true);
                return;
            }

            // Email format check
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showMessage('Please enter a valid email address.', true);
                return;
            }

            if (!password) {
                showMessage('Please enter your password.', true);
                return;
            }

            if (!verifyCode) {
                showMessage('Please enter the verification code.', true);
                return;
            }

            if (verifyCode.length !== 4) {
                showMessage('Verification code must be 4 digits.', true);
                return;
            }

            if (verifyCode !== currentVerifyCode) {
                showMessage('Incorrect verification code. Please try again.', true);
                // নতুন কোড জেনারেট
                generateVerifyCode();
                document.getElementById('verifyInput').value = '';
                return;
            }

            // ============ সব Validation পাস ============
            loginBtn.disabled = true;
            loginBtn.style.opacity = '0.7';
            messageBox.style.display = 'none';

            const lang = safeGet('language') || 'en';
            const t = (typeof translations !== 'undefined' && translations[lang])
                ? translations[lang]
                : { verifying: 'Signing in...', verified: 'Welcome back!' };

            loadingBox.classList.remove('success');
            loadingText.textContent = t.verifying || 'Signing in...';
            loadingOverlay.classList.add('show');

            // Firebase Login
            const result = await loginUser(email, password);

            if (result.success) {
                loadingBox.classList.add('success');
                loadingText.textContent = t.verified || 'Welcome back!';

                // ✅ Auth state ready হওয়ার জন্য অপেক্ষা
                setTimeout(() => {
                    window.location.replace('dashboard.html');
                }, 1500);
            } else {
                loginBtn.disabled = false;
                loginBtn.style.opacity = '1';
                loadingOverlay.classList.remove('show');
                showMessage(translateFirebaseError(result.error), true);
                // নতুন verification code
                generateVerifyCode();
                document.getElementById('verifyInput').value = '';
            }
        });

        // ================= ⌨️ Enter Key Navigation =================
        document.getElementById('emailInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('passwordInput').focus();
        });
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('verifyInput').focus();
        });
        document.getElementById('verifyInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') loginBtn.click();
        });
    </script>
</body>
</html>

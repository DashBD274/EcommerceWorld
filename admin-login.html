<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Admin Login - UMALL247</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body {
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .admin-login-box {
            background: #1e293b;
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }
        
        .admin-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .admin-logo i {
            font-size: 48px;
            color: #f59e0b;
            margin-bottom: 14px;
        }
        
        .admin-logo h1 {
            color: #f1f5f9;
            font-size: 22px;
            font-weight: 800;
        }
        
        .admin-logo p {
            color: #94a3b8;
            font-size: 12.5px;
            margin-top: 6px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group label {
            color: #94a3b8;
            font-size: 12.5px;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #f1f5f9;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }
        
        .form-group input:focus {
            border-color: #f59e0b;
        }
        
        .admin-btn {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(90deg, #f59e0b, #d97706);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            margin-top: 8px;
        }
        
        .admin-btn:disabled {
            opacity: 0.6;
        }
        
        .admin-btn:active {
            transform: scale(0.98);
        }
        
        .admin-message {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 14px;
            font-size: 13px;
            text-align: center;
            display: none;
        }
        
        .admin-message.error {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            display: block;
        }
        
        .admin-message.success {
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.3);
            display: block;
        }
        
        .security-note {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            font-size: 11px;
        }
        
        .security-note i {
            color: #f59e0b;
        }
    </style>
</head>
<body>

    <div class="admin-login-box">
        <div class="admin-logo">
            <i class="fa-solid fa-shield-halved"></i>
            <h1>Admin Panel</h1>
            <p>UMALL247 Management System</p>
        </div>
        
        <div class="admin-message" id="adminMessage"></div>
        
        <div class="form-group">
            <label>Admin Email</label>
            <input type="email" id="adminEmail" placeholder="admin@umall247.com" autocomplete="username">
        </div>
        
        <div class="form-group">
            <label>Admin Password</label>
            <input type="password" id="adminPassword" placeholder="Enter password" autocomplete="current-password">
        </div>
        
        <button class="admin-btn" id="adminLoginBtn" type="button">
            <i class="fa-solid fa-lock"></i> Secure Login
        </button>
        
        <p class="security-note">
            <i class="fa-solid fa-shield"></i> Restricted area. Authorized personnel only.
        </p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-auth.js"></script>

    <script>
        const adminEmail = document.getElementById('adminEmail');
        const adminPassword = document.getElementById('adminPassword');
        const adminLoginBtn = document.getElementById('adminLoginBtn');
        const adminMessage = document.getElementById('adminMessage');
        
        // ✅ যদি আগে থেকেই লগইন থাকে, সরাসরি Dashboard এ যান
        auth.onAuthStateChanged(async function(user) {
            if (user) {
                try {
                    const adminDoc = await db.collection('admins').doc(user.uid).get();
                    if (adminDoc.exists) {
                        window.location.replace('admin.html');
                    }
                } catch (e) {}
            }
        });
        
        function showMsg(text, type) {
            adminMessage.textContent = text;
            adminMessage.className = 'admin-message ' + type;
            setTimeout(() => { adminMessage.className = 'admin-message'; }, 5000);
        }
        
        adminLoginBtn.addEventListener('click', async function() {
            const email = adminEmail.value.trim();
            const password = adminPassword.value;
            
            if (!email || !password) {
                showMsg('❌ Please enter email and password', 'error');
                return;
            }
            
            adminLoginBtn.disabled = true;
            adminLoginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying...';
            
            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Check if user is admin
                const adminDoc = await db.collection('admins').doc(user.uid).get();
                
                if (!adminDoc.exists) {
                    await auth.signOut();
                    showMsg('❌ Access Denied. Not an admin account.', 'error');
                    adminLoginBtn.disabled = false;
                    adminLoginBtn.innerHTML = '<i class="fa-solid fa-lock"></i> Secure Login';
                    return;
                }
                
                showMsg('✅ Access granted. Loading...', 'success');
                setTimeout(() => {
                    window.location.replace('admin.html');
                }, 1000);
                
            } catch (err) {
                console.error('Admin login error:', err);
                adminLoginBtn.disabled = false;
                adminLoginBtn.innerHTML = '<i class="fa-solid fa-lock"></i> Secure Login';
                
                let msg = '❌ Login failed';
                if (err.message.includes('user-not-found')) msg = '❌ No admin account found';
                else if (err.message.includes('wrong-password')) msg = '❌ Incorrect password';
                else if (err.message.includes('invalid-credential')) msg = '❌ Invalid credentials';
                else if (err.message.includes('too-many-requests')) msg = '❌ Too many attempts. Try later';
                
                showMsg(msg, 'error');
            }
        });
        
        adminPassword.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') adminLoginBtn.click();
        });
    </script>
</body>
</html>
